<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="洗腎紀錄">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>洗腎紀錄</title>
<style>
:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #1b2228;
  --muted: #66727d;
  --line: #e3e7eb;
  --accent: #0f7b8a;
  --accent-soft: #e1f2f4;
  --bp-sys: #d1435b;
  --bp-dia: #3b6fd6;
  --uf: #1d8fbf;
  --wt: #d9822b;
  --danger: #c8383d;
  --delivery: #148f77;
  --clinic: #5b57c9;
  --rx: #c2477e;
  --shadow: 0 1px 2px rgba(20, 30, 40, .06), 0 2px 8px rgba(20, 30, 40, .05);
  --radius: 16px;
  --tabbar: 64px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111417;
    --card: #1c2126;
    --text: #e8ecef;
    --muted: #96a2ad;
    --line: #2c333a;
    --accent: #3fb6c6;
    --accent-soft: #17343a;
    --bp-sys: #ef6a80;
    --bp-dia: #6f9bf0;
    --uf: #4ab4e0;
    --wt: #f0a256;
    --danger: #f06b6f;
    --delivery: #3cc3a4;
    --clinic: #918df0;
    --rx: #ec7fae;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 17px;
  line-height: 1.45;
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom) + 16px);
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

header.top {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
header.top h1 { font-size: 28px; margin: 0; letter-spacing: .5px; }
main { padding: 4px 16px 16px; max-width: 640px; margin: 0 auto; }
.view { display: none; }
.view.active { display: block; }

.card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 14px;
}
.card h2 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.btn {
  border: 0; border-radius: 12px; padding: 12px 16px; background: var(--accent-soft); color: var(--accent);
  font-weight: 600; min-height: 46px;
}
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { background: transparent; color: var(--danger); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 15px; border-radius: 10px; }
.iconbtn {
  border: 0; background: var(--accent); color: #fff; width: 44px; height: 44px; border-radius: 50%;
  font-size: 26px; line-height: 1; display: grid; place-items: center;
}

/* 紀錄列表 */
.month-label { font-size: 14px; font-weight: 700; color: var(--muted); margin: 18px 4px 8px; }
.rec {
  display: block; width: 100%; text-align: left; border: 0; background: var(--card);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow);
}
.rec .d { font-weight: 700; font-size: 17px; }
.rec .vals { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.rec .vals span { white-space: nowrap; }
.rec .vals b { font-weight: 600; }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty .big { font-size: 44px; }

.upcoming { border-left: 4px solid var(--accent); }
.up-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.up-item + .up-item { border-top: 1px solid var(--line); }
.chip {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.chip.warn { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.chip.gray { background: color-mix(in srgb, var(--muted) 15%, transparent); color: var(--muted); }

/* 分析 */
.month-switch { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
.month-switch .title { font-size: 20px; font-weight: 700; }
.month-switch button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); font-size: 20px; color: var(--accent); }
.month-switch button:disabled { opacity: .35; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v.up { color: var(--danger); }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart circle { cursor: pointer; }
.tip { min-height: 22px; font-size: 14px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; justify-content: center; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* 提醒 */
.rem { display: flex; gap: 12px; padding: 12px 0; align-items: flex-start; }
.rem + .rem { border-top: 1px solid var(--line); }
.rem .main { flex: 1; min-width: 0; }
.rem .when { font-weight: 700; }
.rem .meta { font-size: 14px; color: var(--muted); margin-top: 2px; }
.rem .note { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.rem .actions { display: flex; flex-direction: column; gap: 6px; flex: none; }
.add-link { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 10px 0 2px; min-height: 44px; }

/* 備份 */
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.list-btns { display: grid; gap: 10px; }
.info { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.info ol { margin: 6px 0 0; padding-left: 22px; }

/* 底部分頁 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  height: calc(var(--tabbar) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--card) 92%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
}
nav.tabs button {
  border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600;
}
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button.active { color: var(--accent); }

/* 編輯視窗 */
.sheet-wrap {
  position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .35);
  display: none; align-items: flex-end; justify-content: center;
}
.sheet-wrap.open { display: flex; }
.sheet {
  background: var(--bg); width: 100%; max-width: 640px; max-height: 94vh; max-height: 94dvh;
  border-radius: 20px 20px 0 0; display: flex; flex-direction: column;
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; padding: 12px 8px;
  border-bottom: 1px solid var(--line);
}
.sheet-head h3 { margin: 0; font-size: 17px; }
.sheet-body { overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
.field { margin-bottom: 14px; }
.field > label, .field > .label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 4px 6px; }
.group { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.group .line { display: flex; align-items: center; gap: 10px; padding: 0 14px; min-height: 52px; }
.group .line + .line { border-top: 1px solid var(--line); }
.group .line > span:first-child { flex: 1; }
.group input[type=text], .group input[type=tel], .group input[type=date], .group input[type=datetime-local], .group select, .group textarea {
  border: 0; background: transparent; padding: 12px 0; min-width: 0; outline: none; font-size: 17px;
}
.group input.num { width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
.group input[type=date], .group input[type=datetime-local] { text-align: right; }
.group select { text-align: right; direction: rtl; }
.group textarea { width: 100%; resize: vertical; min-height: 70px; }
.bp { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 14px; }
.bp input { width: 40%; text-align: center; font-size: 26px !important; font-weight: 700; }
.bp .slash { font-size: 26px; color: var(--muted); }
.sign {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; width: 38px; height: 34px;
  font-size: 16px; font-weight: 700; color: var(--muted); flex: none;
}
.total { font-weight: 700; color: var(--uf); font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); margin: 6px 4px 0; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .s { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .2s; }
.switch .s::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .2s; }
.switch input:checked + .s { background: var(--accent); }
.switch input:checked + .s::after { transform: translateX(20px); }
.seg { display: flex; gap: 6px; padding: 10px 14px; flex-wrap: wrap; }
.seg button { flex: 1; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 4px; min-height: 40px; font-size: 15px; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

/* 機台問題 */
.m-intro { font-size: 16px; margin: 0 0 14px; }
.m-sec { font-size: 19px; font-weight: 800; margin: 22px 4px 6px; }
.m-desc { font-size: 15px; color: var(--muted); margin: 0 4px 12px; }
.m-card h3 { margin: 0 0 2px; font-size: 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.m-card .en { color: var(--danger); font-style: italic; font-weight: 600; font-size: 15px; }
.m-card .code { font-variant-numeric: tabular-nums; }
.m-k { font-size: 13px; font-weight: 700; color: var(--muted); margin: 12px 0 2px; letter-spacing: .5px; }
.m-card p { margin: 0; }
.m-card ol { margin: 4px 0 0; padding-left: 24px; }
.m-card li { margin: 4px 0; }
.m-card li.warn { color: var(--danger); font-weight: 600; }
.m-card.flash { outline: 3px solid var(--accent); outline-offset: 2px; transition: outline-color 1s; }
.m-tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.m-rule { display: flex; gap: 10px; }
.m-rule + .m-rule { margin-top: 12px; }
.m-rule .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.kbd { display: inline-block; padding: 0 6px; border-radius: 6px; background: var(--danger); color: #fff; font-weight: 700; font-size: 14px; }
.ask textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 12px; min-height: 84px; resize: vertical; outline: none; font-size: 17px; }
.ask textarea:focus { border-color: var(--accent); }
.ask .pv { position: relative; width: 96px; height: 96px; border-radius: 12px; overflow: hidden; margin-top: 10px; }
.ask .pv img { width: 100%; height: 100%; object-fit: cover; }
.ask .pv button { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 1; }
.calls { display: grid; gap: 10px; }
.calls a { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }

/* 驗血報告 */
.lab-tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.lab-tbl th, .lab-tbl td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.lab-tbl th:first-child, .lab-tbl td:first-child { text-align: left; }
.lab-tbl thead th { font-size: 13px; color: var(--muted); font-weight: 700; }
.lab-tbl td .u { display: block; font-size: 11px; color: var(--muted); }
.lab-tbl .chg { font-size: 13px; font-weight: 700; white-space: nowrap; }
.lab-tbl .chg.up { color: var(--danger); }
.lab-tbl .chg.down { color: var(--bp-dia); }
.lab-tbl tr.grp td { font-size: 12px; font-weight: 800; color: var(--accent); padding-top: 14px; border-bottom: 0; }
.lab-item { display: flex; align-items: center; gap: 8px; padding: 0 14px; min-height: 50px; }
.lab-item + .lab-item { border-top: 1px solid var(--line); }
.lab-item .nm { flex: 1; min-width: 0; }
.lab-item .nm small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.lab-item input { width: 90px; text-align: right; border: 0; background: transparent; font-size: 17px; outline: none; padding: 10px 0; font-variant-numeric: tabular-nums; }
.lab-item input.filled { color: var(--accent); font-weight: 700; }
.lab-item .unit { width: 58px; font-size: 12px; color: var(--muted); }
.ocr-bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.ocr-bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
details.raw summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 15px; padding: 6px 0; }
details.raw pre { white-space: pre-wrap; font-size: 13px; background: var(--bg); padding: 10px; border-radius: 10px; max-height: 240px; overflow: auto; margin: 6px 0 0; }

/* 身心障礙證明 */
.docs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.doc-slot {
  border: 0; border-radius: 14px; padding: 0; background: var(--bg); overflow: hidden; text-align: center;
  display: flex; flex-direction: column; min-height: 132px;
}
.doc-slot .thumb { flex: 1; min-height: 96px; background: #000 center/cover no-repeat; }
.doc-slot.empty { border: 2px dashed var(--line); background: transparent; color: var(--accent); justify-content: center; align-items: center; gap: 4px; padding: 10px; }
.doc-slot.empty .plus { font-size: 28px; line-height: 1; }
.doc-slot .cap { font-size: 14px; font-weight: 700; padding: 8px 6px; line-height: 1.3; }
.doc-slot .cap small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.docview {
  position: fixed; inset: 0; z-index: 45; background: #000; display: none; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.docview.open { display: flex; }
.dv-bar { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
.dv-home { border: 0; border-radius: 999px; background: #fff; color: #111; font-weight: 800; font-size: 18px; padding: 12px 20px; min-height: 50px; }
.dv-title { color: #ccd; font-size: 15px; font-weight: 600; flex: 1; text-align: right; }
.dv-img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px; }
.dv-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.dv-foot { display: flex; gap: 8px; padding: 10px 12px 14px; }
.dv-foot button { flex: 1; border: 0; border-radius: 12px; min-height: 46px; font-weight: 600; background: #2a2f35; color: #fff; font-size: 16px; }
.dv-foot .del { color: #ff7b7f; }

/* 照片 */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; padding: 12px 14px; }
.photos .ph { aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 0; padding: 0; background: var(--line); }
.photos .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .add {
  aspect-ratio: 1; border-radius: 10px; border: 2px dashed var(--line); background: transparent; color: var(--accent);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; gap: 2px;
}
.photos .add span { font-size: 26px; line-height: 1; }
.viewer {
  position: fixed; inset: 0; z-index: 40; background: #000; display: none; flex-direction: column;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.viewer.open { display: flex; }
.viewer .img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer .vbar { display: flex; gap: 8px; padding: 12px 12px 16px; }
.viewer .vbar button { flex: 1; border: 0; border-radius: 12px; min-height: 48px; font-weight: 600; background: #2a2f35; color: #fff; font-size: 16px; }
.viewer .vbar .del { color: #ff7b7f; }
.viewer .vdate { color: #aab; text-align: center; font-size: 14px; padding-top: 10px; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom) + 16px);
  transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px;
  border-radius: 999px; font-size: 15px; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none;
  max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="top">
  <h1 id="pageTitle">每日紀錄</h1>
  <button class="iconbtn" id="addBtn" aria-label="新增紀錄">＋</button>
</header>

<main>
  <!-- 紀錄 -->
  <section class="view active" id="view-records">
    <div id="profile"></div>
    <div id="docs"></div>
    <div id="upcoming"></div>
    <div id="recordList"></div>
  </section>

  <!-- 分析 -->
  <section class="view" id="view-analysis">
    <div class="month-switch">
      <button id="prevMonth" aria-label="上個月">‹</button>
      <div class="title" id="monthTitle"></div>
      <button id="nextMonth" aria-label="下個月">›</button>
    </div>
    <div id="analysis"></div>
  </section>

  <!-- 提醒 -->
  <section class="view" id="view-reminders">
    <div id="reminderList"></div>
  </section>

  <!-- 備份 -->
  <section class="view" id="view-labs">
    <div id="labs"></div>
  </section>

  <section class="view" id="view-machine">
    <div id="machine"></div>
  </section>

  <section class="view" id="view-backup">
    <div id="installTip"></div>
    <div class="card">
      <h2>資料備份</h2>
      <p class="muted small" style="margin-top:0">紀錄只存在這支手機裡。建議每月備份一次，換手機或誤刪時可以還原。</p>
      <p class="small" id="backupStatus"></p>
      <div class="list-btns">
        <button class="btn primary block" id="exportJson">匯出備份檔</button>
        <button class="btn block" id="importJson">從備份檔還原</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="card">
      <h2>給醫護人員</h2>
      <p class="muted small" style="margin-top:0">匯出表格檔（CSV），可用 Excel 或 Numbers 開啟。</p>
      <button class="btn block" id="exportCsv">匯出紀錄表格</button>
    </div>
    <div class="card">
      <h2>分享給病友</h2>
      <p class="muted small" style="margin-top:0">iPhone 和安卓手機都能用。對方打開網址後加入主畫面即可，每個人的資料各自存在自己的手機裡，不會互相看到。</p>
      <button class="btn block" id="shareApp">分享 App 網址</button>
    </div>
    <div class="card">
      <h2>其他</h2>
      <p class="small muted" id="storageInfo" style="margin-top:0"></p>
      <button class="btn danger block" id="clearAll">清除所有資料</button>

    <p class="muted small" style="text-align:center">本 App 僅供個人紀錄，數值判讀請依醫師與護理師指示。</p>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ============ 資料 ============ */
const KEY = 'dialysis-tracker-v1';
const KINDS = {
  delivery: { name: '送藥水', icon: '📦', color: 'var(--delivery)', lead: 1, repeat: 0,
              action: '藥水送達，請留意收貨', when: '送達時間', ph: '例如：廠商電話、箱數' },
  clinic:   { name: '回診', icon: '🩺', color: 'var(--clinic)', lead: 1, repeat: 0,
              action: '回診，記得帶紀錄與健保卡', when: '回診時間', ph: '例如：醫院、科別、診號、要抽血' },
  rx:       { name: '慢性處方箋', icon: '💊', color: 'var(--rx)', lead: 3, repeat: 28,
              action: '可領取慢性處方箋藥物', when: '可領藥日', ph: '例如：領藥地點、第幾次領' }
};

let db = load();
if (!Array.isArray(db.labs)) db.labs = [];

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.records) && Array.isArray(d.reminders)) return d;
  } catch (e) {}
  return { records: [], reminders: [], lastBackup: null };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('儲存失敗，手機空間可能不足'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const isAndroid = /Android/i.test(navigator.userAgent);

/* ============ 工具 ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDay = s => { const d = parseYmd(s); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const fmtDT = d => `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）${pad(d.getHours())}:${pad(d.getMinutes())}`;
const num = s => {
  if (s === null || s === undefined) return null;
  const t = String(s).trim().replace(/，|,/g, '.').replace(/[－—–]/g, '-');
  if (t === '' || t === '-') return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
};
const fmt = (n, digits = 1) => n === null || n === undefined ? '—' :
  (Math.round(n * 10 ** digits) / 10 ** digits).toLocaleString('en-US', { maximumFractionDigits: digits, useGrouping: false });
const signed = (n, digits = 1) => {
  if (n === null) return '—';
  const r = Math.round(n * 10 ** digits) / 10 ** digits;
  return r === 0 ? '±0' : (r > 0 ? '+' : '') + fmt(r, digits);
};
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const bagSum = r => { const v = r.bags.filter(x => x !== null); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
const totalUF = r => r.total !== null && r.total !== undefined ? r.total : bagSum(r);

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============ 分頁 ============ */
const TITLES = { records: '每日紀錄', analysis: '每月分析', reminders: '提醒', machine: '機台問題', labs: '驗血報告', backup: '備份與設定' };
let currentTab = 'records';
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab));
  $('#pageTitle').textContent = TITLES[tab];
  $('#addBtn').style.visibility = (tab === 'records' || tab === 'reminders' || tab === 'labs') ? 'visible' : 'hidden';
  $('#addBtn').setAttribute('aria-label', tab === 'reminders' ? '新增提醒' : tab === 'labs' ? '新增驗血報告' : '新增紀錄');
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('#addBtn').addEventListener('click', () => {
  if (currentTab === 'reminders') return openReminder(null, 'clinic');
  if (currentTab === 'labs') return openLab(null);
  const t = db.records.find(r => r.date === today());
  openRecord(t || null);
});

function render() {
  if (currentTab === 'records') renderRecords();
  if (currentTab === 'analysis') renderAnalysis();
  if (currentTab === 'reminders') renderReminders();
  if (currentTab === 'backup') renderBackup();
  if (currentTab === 'machine') renderMachine();
  if (currentTab === 'labs') renderLabs();
}

/* ============ 紀錄頁 ============ */
// 分機：主號碼後加逗號（撥通後自動等待再撥分機）
function telHref(phone) {
  const parts = String(phone || '').split(/分機|轉|ext\.?|#/i);
  const digits = x => x.replace(/[^\d+]/g, '');
  return digits(parts[0]) + (parts[1] && digits(parts[1]) ? ',' + digits(parts[1]) : '');
}

function renderProfile() {
  const p = db.profile || {};
  const box = $('#profile');
  if (!p.hospital && !p.doctor && !p.phone) {
    box.innerHTML = `<button class="card" id="profEdit" style="display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left">
      <span style="font-size:28px">🏥</span>
      <span style="flex:1"><b>設定醫院與緊急聯絡電話</b><br><span class="muted small">填入主治醫院、醫師與電話，需要時一鍵撥打</span></span>
      <span style="color:var(--accent);font-size:22px">›</span></button>`;
  } else {
    const tel = telHref(p.phone);
    box.innerHTML = `<div class="card">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <span style="font-size:26px;line-height:1.2">🏥</span>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700">${esc(p.hospital || '（未填醫院）')}</div>
          <div class="muted small">主治醫師：${esc(p.doctor || '未填')}</div>
        </div>
        <button class="btn sm ghost" id="profEdit">編輯</button>
      </div>
      ${tel ? `<a class="btn primary block" href="tel:${tel}" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;text-decoration:none;font-size:18px">📞 緊急聯絡 ${esc(p.phone)}</a>` :
        `<p class="muted small" style="margin:10px 0 0">尚未填寫緊急聯絡電話</p>`}
    </div>`;
  }
  $('#profEdit').addEventListener('click', openProfile);
}

function openProfile() {
  const p = db.profile || {};
  openSheet('醫院與緊急聯絡', `
    <div class="field"><div class="group">
      <div class="line"><span>醫院</span><input type="text" id="p-hosp" placeholder="例如：○○醫院 腹膜透析室" value="${esc(p.hospital || '')}" style="text-align:right;flex:2"></div>
      <div class="line"><span>主治醫師</span><input type="text" id="p-doc" placeholder="例如：王○○ 醫師" value="${esc(p.doctor || '')}" style="text-align:right;flex:2"></div>
      <div class="line"><span>緊急聯絡電話</span><input type="tel" id="p-tel" inputmode="tel" placeholder="例如：02-1234-5678" value="${esc(p.phone || '')}" style="text-align:right;flex:2"></div>
      <div class="line"><span>機台報修電話</span><input type="tel" id="p-repair" inputmode="tel" placeholder="百特客服或護理專線" value="${esc(p.repair || '')}" style="text-align:right;flex:2"></div>
    </div>
    <p class="hint">建議填透析室或醫院 24 小時可聯絡的電話。填好後在首頁點一下就能直接撥打；機台報修電話會顯示在「機台」頁。</p></div>
  `, () => {
    db.profile = { hospital: $('#p-hosp').value.trim(), doctor: $('#p-doc').value.trim(), phone: $('#p-tel').value.trim(), repair: $('#p-repair').value.trim() };
    save(); toast('已儲存');
    if (currentTab === 'machine') setTimeout(renderMachine, 0);
  });
}

function renderRecords() {
  renderProfile();
  renderDocs();
  renderUpcoming();
  const list = $('#recordList');
  const recs = [...db.records].sort((a, b) => b.date.localeCompare(a.date));
  if (!recs.length) {
    list.innerHTML = `<div class="empty"><div class="big">📋</div><p>還沒有紀錄<br>點右上角 ＋ 新增今天的紀錄</p></div>`;
    return;
  }
  let html = '', lastMonth = '';
  for (const r of recs) {
    const m = r.date.slice(0, 7);
    if (m !== lastMonth) {
      lastMonth = m;
      html += `<div class="month-label">${Number(m.slice(0, 4))}年${Number(m.slice(5))}月</div>`;
    }
    const bp = r.sys !== null && r.dia !== null ? `${r.sys}/${r.dia}` : (r.sys ?? r.dia ?? '—');
    const uf = totalUF(r);
    html += `<button class="rec" data-id="${r.id}">
      <div class="d">${fmtDay(r.date)}${r.date === today() ? ' <span class="chip">今天</span>' : ''}</div>
      <div class="vals">
        <span><span class="dot" style="background:var(--bp-sys)"></span> 血壓 <b>${bp}</b></span>
        <span><span class="dot" style="background:var(--wt)"></span> 體重 <b>${r.weight !== null ? fmt(r.weight) + ' kg' : '—'}</b></span>
        <span><span class="dot" style="background:var(--uf)"></span> 脫水 <b>${uf !== null ? fmt(uf, 0) + ' mL' : '—'}</b></span>
        ${r.edema === true ? '<span class="chip warn">有水腫</span>' : r.edema === false ? '<span class="chip gray">無水腫</span>' : ''}
      </div>
      ${r.note || (r.photos && r.photos.length) ? `<div class="muted small" style="margin-top:4px">${r.photos && r.photos.length ? `📷 ${r.photos.length} 張照片${r.note ? '・' : ''}` : ''}${esc(r.note)}</div>` : ''}
    </button>`;
  }
  list.innerHTML = html;
  list.querySelectorAll('.rec').forEach(b => b.addEventListener('click', () => openRecord(db.records.find(r => r.id === b.dataset.id))));
}

function renderUpcoming() {
  const now = new Date();
  const soon = db.reminders
    .map(r => ({ r, next: nextOccurrence(r), days: daysUntil(nextOccurrence(r)) }))
    .filter(x => x.next >= now && x.days <= 3)
    .sort((a, b) => a.next - b.next);
  const box = $('#upcoming');
  const needBackup = db.records.length >= 7 &&
    (!db.lastBackup || (now - new Date(db.lastBackup)) / 864e5 > 30);
  let html = '';
  if (soon.length) {
    html += `<div class="card upcoming"><h2>近期提醒</h2>` + soon.map(x => {
      const k = KINDS[x.r.kind];
      return `<div class="up-item"><span>${k.icon}</span><div style="flex:1"><b>${k.name}</b> <span class="muted small">${fmtDT(x.next)}</span></div>${countdownChip(x.days)}</div>`;
    }).join('') + `</div>`;
  }
  if (needBackup) {
    html += `<div class="card" style="display:flex;align-items:center;gap:12px"><div style="flex:1" class="small">已超過一個月沒有備份資料</div><button class="btn sm" id="goBackup">去備份</button></div>`;
  }
  box.innerHTML = html;
  const gb = $('#goBackup'); if (gb) gb.addEventListener('click', () => showTab('backup'));
}

/* ============ 編輯視窗 ============ */
let sheetSave = null;
function openSheet(title, bodyHtml, onSave, saveText = '儲存') {
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = bodyHtml;
  $('#sheetSave').textContent = saveText;
  $('#sheetSave').style.visibility = onSave ? 'visible' : 'hidden';
  sheetSave = onSave;
  $('#sheet').classList.add('open');
  $('#sheetBody').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  $('#sheet').classList.remove('open');
  document.body.style.overflow = '';
  sheetSave = null;
}
$('#sheetCancel').addEventListener('click', closeSheet);
$('#sheetSave').addEventListener('click', () => { if (sheetSave && sheetSave() !== false) { closeSheet(); render(); } });
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

const BAG_NAMES = ['第一包脫水', '第二包脫水', '第三包脫水', '第四包脫水'];
const v = x => x === null || x === undefined ? '' : String(x);

function openRecord(rec) {
  const r = rec || { id: null, date: today(), sys: null, dia: null, weight: null, bags: [null, null, null, null], total: null, note: '' };
  const manual = r.total !== null && r.total !== undefined;
  let edema = r.edema === true || r.edema === false ? r.edema : null;
  const body = `
    <div class="field"><div class="group"><div class="line"><span>日期</span><input type="date" id="f-date" value="${r.date}" max="${today()}"></div></div></div>

    <div class="field"><span class="label">血壓（mmHg）</span>
      <div class="group"><div class="bp">
        <input type="text" inputmode="numeric" id="f-sys" placeholder="收縮壓" value="${v(r.sys)}" maxlength="3">
        <span class="slash">/</span>
        <input type="text" inputmode="numeric" id="f-dia" placeholder="舒張壓" value="${v(r.dia)}" maxlength="3">
      </div></div>
    </div>

    <div class="field"><div class="group"><div class="line"><span>體重（kg）</span><input class="num" type="text" inputmode="decimal" id="f-weight" placeholder="例如 58.4" value="${v(r.weight)}"></div></div></div>

    <div class="field"><span class="label">脫水量（mL）</span>
      <div class="group">
        ${BAG_NAMES.map((n, i) => `<div class="line"><span>${n}</span>
          <button type="button" class="sign" data-i="${i}" aria-label="正負切換">±</button>
          <input class="num bag" type="text" inputmode="decimal" id="f-bag${i}" placeholder="mL" value="${v(r.bags[i])}"></div>`).join('')}
        <div class="line"><span>手動輸入全天脫水量</span><label class="switch"><input type="checkbox" id="f-manual" ${manual ? 'checked' : ''}><span class="s"></span></label></div>
        <div class="line" id="autoLine"><span>全天脫水量</span><span class="total" id="f-auto">—</span></div>
        <div class="line" id="manualLine"><span>全天脫水量</span>
          <button type="button" class="sign" data-i="t" aria-label="正負切換">±</button>
          <input class="num" type="text" inputmode="decimal" id="f-total" placeholder="mL" value="${manual ? v(r.total) : ''}"></div>
      </div>
      <p class="hint">全天脫水量預設為四包加總。引流少於灌入時，按 ± 改成負數。</p>
    </div>

    <div class="field"><span class="label">備註</span>
      <div class="group">
        <div class="line"><span>是否水腫</span>
          <div class="seg" id="edemaSeg" style="padding:8px 0;flex:none">
            <button type="button" data-e="0" style="min-width:64px">無</button>
            <button type="button" data-e="1" style="min-width:64px">有</button>
          </div>
        </div>
        <div class="line" style="padding-bottom:4px"><textarea id="f-note" placeholder="其他敘述，例如：身體狀況、引流液外觀">${esc(r.note)}</textarea></div>
        <div class="line" style="min-height:40px;padding-top:10px"><span class="small muted">照片（水腫或其他狀況）</span></div>
        <div class="photos" id="f-photos" style="padding-top:4px"></div>
      </div>
      <p class="hint">用相機拍的照片不會自動進相簿，想另外保存可點開照片按「${isAndroid ? '下載到手機' : '存到手機相簿'}」。</p>
    </div>

    ${rec ? `<button class="btn danger block" id="f-del">刪除這筆紀錄</button>` : ''}
  `;
  openSheet(rec ? '編輯紀錄' : '新增紀錄', body, () => {
    const date = $('#f-date').value || today();
    const out = {
      id: r.id || uid(),
      date,
      sys: num($('#f-sys').value), dia: num($('#f-dia').value),
      weight: num($('#f-weight').value),
      bags: [0, 1, 2, 3].map(i => num($(`#f-bag${i}`).value)),
      total: $('#f-manual').checked ? num($('#f-total').value) : null,
      edema,
      note: $('#f-note').value.trim(),
      photos: photos.map(p => p.id)
    };
    if (out.sys !== null) out.sys = Math.round(out.sys);
    if (out.dia !== null) out.dia = Math.round(out.dia);
    const empty = out.sys === null && out.dia === null && out.weight === null &&
      out.bags.every(x => x === null) && out.total === null && out.edema === null && !out.note && !out.photos.length;
    if (empty) { toast('請至少填一個項目'); return false; }
    const dup = db.records.find(x => x.date === date && x.id !== out.id);
    if (dup) {
      if (!confirm(`${fmtDay(date)} 已經有一筆紀錄，要用這次的內容取代嗎？${dup.photos && dup.photos.length ? '\n（該筆紀錄的照片會併入這筆）' : ''}`)) return false;
      out.photos = [...(dup.photos || []), ...out.photos];
      db.records = db.records.filter(x => x !== dup);
    }
    // 照片：寫入新加的、刪除移除的
    const removed = (r.photos || []).filter(id => !out.photos.includes(id));
    Promise.all([
      ...photos.filter(p => p.isNew).map(p => idb.put({ id: p.id, blob: p.blob, thumb: p.thumb, date: out.date })),
      ...removed.map(id => idb.del(id))
    ]).catch(() => alert('照片儲存失敗，手機空間可能不足。'));
    const i = db.records.findIndex(x => x.id === out.id);
    if (i >= 0) db.records[i] = out; else db.records.push(out);
    save(); toast('已儲存');
  });

  // ---- 照片 ----
  const photos = []; // {id, isNew, blob?, thumb}
  const drawPhotos = () => {

    $('#manualLine').style.display = m ? '' : 'none';

  $('#sheetBody').querySelectorAll('input').forEach(i => i.addEventListener('input', update));
  $('#f-manual').addEventListener('change', update);
  $('#sheetBody').querySelectorAll('.sign').forEach(b => b.addEventListener('click', () => {

  const syncEdema = () => $('#edemaSeg').querySelectorAll('button').forEach(b =>

  $('#edemaSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {

    (r.photos || []).forEach(id => idb.del(id).catch(() => {}));

/* ============ 分析頁 ============ */
let viewMonth = (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();
$('#prevMonth').addEventListener('click', () => shiftMonth(-1));
$('#nextMonth').addEventListener('click', () => shiftMonth(1));
function shiftMonth(n) {
  const d = new Date(viewMonth.y, viewMonth.m + n, 1);
  viewMonth = { y: d.getFullYear(), m: d.getMonth() };
  renderAnalysis();
}
const monthKey = (y, m) => `${y}-${pad(m + 1)}`;

function renderAnalysis() {
  const { y, m } = viewMonth;
  const now = new Date();
  $('#monthTitle').textContent = `${y}年${m + 1}月`;
  $('#nextMonth').disabled = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());
  const key = monthKey(y, m);
  const pd = new Date(y, m - 1, 1);
  const pkey = monthKey(pd.getFullYear(), pd.getMonth());
  const cur = db.records.filter(r => r.date.startsWith(key)).sort((a, b) => a.date.localeCompare(b.date));
  const prev = db.records.filter(r => r.date.startsWith(pkey));
  const days = new Date(y, m + 1, 0).getDate();
  const day = r => Number(r.date.slice(8));
  const pts = (arr, f) => arr.map(r => ({ d: day(r), v: f(r) })).filter(p => p.v !== null && p.v !== undefined);

  const sys = pts(cur, r => r.sys), dia = pts(cur, r => r.dia);
  const uf = pts(cur, totalUF), wt = pts(cur, r => r.weight);
  const vals = a => a.map(p => p.v);
  const pAvg = f => avg(prev.map(f).filter(x => x !== null && x !== undefined));

  let html = '';

  // 血壓
  {
    const aS = avg(vals(sys)), aD = avg(vals(dia));
    const pS = pAvg(r => r.sys), pD = pAvg(r => r.dia);
    const pair = (a, b) => a === null && b === null ? '—' : `${a === null ? '—' : Math.round(a)}/${b === null ? '—' : Math.round(b)}`;
    const diff = aS !== null && aD !== null && pS !== null && pD !== null ? `${signed(aS - pS, 0)}/${signed(aD - pD, 0)}` : '—';
    html += `<div class="card"><h2><span class="dot" style="background:var(--bp-sys)"></span>血壓（mmHg）</h2>`;
    if (!sys.length && !dia.length) html += empty();
    else {
      html += stats([
        ['平均', pair(aS, aD)],
        ['最高', pair(max(vals(sys)), max(vals(dia)))],
        ['最低', pair(min(vals(sys)), min(vals(dia)))],
        ['較上月', diff]
      ]);
      html += `<div class="chart">${chart({ days, m, unit: 'mmHg', digits: 0,
        series: [{ name: '收縮壓', color: 'var(--bp-sys)', pts: sys }, { name: '舒張壓', color: 'var(--bp-dia)', pts: dia }],
        avgs: [{ v: aS, color: 'var(--bp-sys)' }, { v: aD, color: 'var(--bp-dia)' }] })}</div>
        <div class="legend"><span><span class="dot" style="background:var(--bp-sys)"></span>收縮壓</span><span><span class="dot" style="background:var(--bp-dia)"></span>舒張壓</span><span class="muted">虛線＝平均</span></div>
        <div class="tip"></div>`;
    }
    html += `</div>`;
  }
  html += metricCard('全天脫水量', 'mL', 'var(--uf)', 0, uf, pAvg(totalUF), days, m);
  html += metricCard('體重', 'kg', 'var(--wt)', 1, wt, pAvg(r => r.weight), days, m);
  const edemaDays = cur.filter(r => r.edema === true).length;
  html += `<p class="muted small" style="text-align:center">本月共 ${cur.length} 天有紀錄${edemaDays ? `・水腫 ${edemaDays} 天` : ''}<br>點圖上的點可看數值</p>`;

  const box = $('#analysis');
  box.innerHTML = html;
  box.querySelectorAll('.card').forEach(card => {
    const tip = $('.tip', card);
    card.querySelectorAll('circle[data-tip]').forEach(c => c.addEventListener('click', () => {
      card.querySelectorAll('circle[data-tip]').forEach(o => o.setAttribute('r', 3.5));
      c.setAttribute('r', 6);
      if (tip) tip.textContent = c.dataset.tip;
    }));
  });
}
const max = a => a.length ? Math.max(...a) : null;
const min = a => a.length ? Math.min(...a) : null;
const empty = () => `<p class="muted" style="text-align:center;padding:28px 0;margin:0">本月尚無資料</p>`;
function stats(items) {
  return `<div class="stats">${items.map(([k, val]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v">${val}</div></div>`).join('')}</div>`;
}
function metricCard(title, unit, color, digits, pts, prevAvg, days, m) {
  let html = `<div class="card"><h2><span class="dot" style="background:${color}"></span>${title}（${unit}）</h2>`;
  if (!pts.length) return html + empty() + `</div>`;
  const vals = pts.map(p => p.v);
  const a = avg(vals);
  html += stats([
    ['平均', fmt(a, digits)],
    ['最高', fmt(max(vals), digits)],
    ['最低', fmt(min(vals), digits)],
    ['較上月', a !== null && prevAvg !== null ? signed(a - prevAvg, digits) : '—']
  ]);
  html += `<div class="chart">${chart({ days, m, unit, digits, series: [{ name: title, color, pts }], avgs: [{ v: a, color, label: true }] })}</div><div class="tip"></div></div>`;
  return html;
}

function niceStep(raw) {
  const p = 10 ** Math.floor(Math.log10(raw));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function chart({ days, m, unit, digits, series, avgs }) {
  const W = 340, H = 200, L = 40, R = 12, T = 16, B = 26;
  const all = series.flatMap(s => s.pts.map(p => p.v)).concat(avgs.map(a => a.v).filter(x => x !== null));
  let lo = Math.min(...all), hi = Math.max(...all);
  if (lo === hi) { lo -= 1; hi += 1; }
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  if (hi === lo) hi = lo + step;
  const x = d => L + (d - 1) / (days - 1) * (W - L - R);
  const y = val => T + (hi - val) / (hi - lo) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="折線圖">`;
  const sd = step < 1 ? 1 : 0;
  for (let g = lo; g <= hi + step / 2; g += step) {
    s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}"/>`;
    s += `<text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${fmt(g, sd)}</text>`;
  }
  for (const d of [1, 8, 15, 22, 29]) {
    if (d > days) continue;
    s += `<text x="${x(d)}" y="${H - 6}" text-anchor="middle">${m + 1}/${d}</text>`;
  }
  for (const a of avgs) {
    if (a.v === null) continue;
    s += `<line x1="${L}" x2="${W - R}" y1="${y(a.v)}" y2="${y(a.v)}" stroke="${a.color}" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>`;
    if (a.label) s += `<text x="${W - R}" y="${y(a.v) - 5}" text-anchor="end" style="fill:${a.color};font-weight:600">平均 ${fmt(a.v, digits)}</text>`;
  }
  for (const se of series) {
    const p = [...se.pts].sort((a, b) => a.d - b.d);
    if (p.length > 1) s += `<polyline fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${p.map(q => `${x(q.d).toFixed(1)},${y(q.v).toFixed(1)}`).join(' ')}"/>`;
    for (const q of p) {
      s += `<circle cx="${x(q.d).toFixed(1)}" cy="${y(q.v).toFixed(1)}" r="3.5" fill="${se.color}" stroke="var(--card)" stroke-width="1.5" data-tip="${m + 1}/${q.d} ${se.name} ${fmt(q.v, digits)} ${unit}"/>`;
      // 加大點擊範圍
      s += `<circle cx="${x(q.d).toFixed(1)}" cy="${y(q.v).toFixed(1)}" r="12" fill="transparent" data-tip="${m + 1}/${q.d} ${se.name} ${fmt(q.v, digits)} ${unit}"/>`;
    }
  }
  return s + `</svg>`;
}

/* ============ 提醒頁 ============ */
function nextOccurrence(r) {
  let d = new Date(r.datetime);
  if (r.repeat > 0) {
    const now = new Date();
    while (d < now) d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + r.repeat, d.getHours(), d.getMinutes());
  }
  return d;
}
function daysUntil(d) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(d); b.setHours(0, 0, 0, 0);
  return Math.round((b - a) / 864e5);
}
function countdownChip(days) {
  if (days < 0) return `<span class="chip gray">已過期</span>`;
  if (days === 0) return `<span class="chip warn">今天</span>`;
  if (days === 1) return `<span class="chip warn">明天</span>`;
  return `<span class="chip">還有 ${days} 天</span>`;
}

  for (const [kind, k] of Object.entries(KINDS)) {
    const items = db.reminders.filter(r => r.kind === kind).sort((a, b) => nextOccurrence(a) - nextOccurrence(b));
    html += `<div class="card"><h2><span>${k.icon}</span><span style="color:${k.color}">${k.name}</span></h2>`;

      html += `<div class="rem">
        <div class="main">
          <div class="when">${fmtDT(n)} ${countdownChip(daysUntil(n))}</div>
          <div class="meta">${meta}${r.calAdded ? '・已加入行事曆' : ''}</div>

    }

  }

function localDT(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }

  syncRep();

/* ============ 行事曆（.ics） ============ */
function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsUtc(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
function fold(line) {
  // 每行最多 75 bytes（UTF-8）
  const enc = new TextEncoder();
  let out = '', cur = '', bytes = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (bytes + b > 73) { out += cur + '\r\n '; cur = ''; bytes = 1; }
    cur += ch; bytes += b;
  }
  return out + cur;
}
function buildIcs(rems) {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Dialysis Tracker//ZH-TW', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  const stamp = icsUtc(new Date());
  for (const r of rems) {
    const k = KINDS[r.kind];
    const start = new Date(r.datetime);
    const end = new Date(start.getTime() + 30 * 60000);
    L.push('BEGIN:VEVENT', `UID:${r.id}@dialysis-tracker`, `DTSTAMP:${stamp}`,
      `DTSTART:${icsUtc(start)}`, `DTEND:${icsUtc(end)}`,
      `SUMMARY:${icsEsc(k.icon + ' ' + k.name)}`,
      `DESCRIPTION:${icsEsc(k.action + (r.note ? '\n' + r.note : ''))}`);
    if (r.repeat > 0) L.push(`RRULE:FREQ=DAILY;INTERVAL=${r.repeat}`);
    if (r.lead > 0) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(`${r.lead} 天後${k.name}`)}`, `TRIGGER:-P${r.lead}D`, 'END:VALARM');
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(k.name)}`, 'TRIGGER:PT0M', 'END:VALARM');
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n') + '\r\n';
}
// Google 日曆新增活動連結（安卓用）。lead = true 時建立「提前通知」那一筆
function gcalUrl(r, lead) {
  const k = KINDS[r.kind];
  const ev = new Date(r.datetime);
  const start = lead ? new Date(ev.getFullYear(), ev.getMonth(), ev.getDate() - r.lead, ev.getHours(), ev.getMinutes()) : ev;
  const end = new Date(start.getTime() + 30 * 60000);
  const p = new URLSearchParams({
    action: 'TEMPLATE',
    text: lead ? `${k.icon} 提醒：${r.lead} 天後${k.name}` : `${k.icon} ${k.name}`,
    dates: `${icsUtc(start)}/${icsUtc(end)}`,
    details: (lead ? `${r.lead} 天後（${fmtDT(ev)}）` : '') + k.action + (r.note ? '\n' + r.note : '')
  });
  if (r.repeat > 0) p.set('recur', `RRULE:FREQ=DAILY;INTERVAL=${r.repeat}`);
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function openExternal(url) {
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
function downloadIcs(ics, name) {
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function addToCalendarAndroid(rems, ics, name) {

/* ============ 驗血報告 ============ */
const LAB_ITEMS = [
  { g: '腎功能', k: 'bun', n: '尿素氮', e: 'BUN', u: 'mg/dL', re: /\bBUN\b|尿素氮/i },

  { g: '腎功能', k: 'ua', n: '尿酸', e: 'UA', u: 'mg/dL', re: /Uric\s*acid|\bUA\b|尿酸/i },
  { g: '腎功能', k: 'ktv', n: '透析清除率', e: 'Kt/V', u: '', re: /Kt\s*\/\s*V/i },

  { g: '電解質', k: 'k', n: '鉀', e: 'K', u: 'mmol/L', re: /Potassium|\bK\b|鉀/i },
  { g: '電解質', k: 'ca', n: '鈣', e: 'Ca', u: 'mg/dL', re: /Calcium|\bCa\b|鈣/i },
  { g: '電解質', k: 'p', n: '磷', e: 'P', u: 'mg/dL', re: /Phosph\w*|\bI?P\b|磷/i },
  { g: '電解質', k: 'ipth', n: '副甲狀腺素', e: 'iPTH', u: 'pg/mL', re: /i-?PTH|\bPTH\b|副甲狀腺/i },
  { g: '營養與貧血', k: 'alb', n: '白蛋白', e: 'Alb', u: 'g/dL', re: /Albumin|\bALB\b|白蛋白/i },
  { g: '營養與貧血', k: 'hb', n: '血色素', e: 'Hb', u: 'g/dL', re: /Ha?emoglobin|\bHb\b|\bHGB\b|血色素|血紅素/i, ex: /A1c|糖化/i },
  { g: '營養與貧血', k: 'hct', n: '血球容積比', e: 'Hct', u: '%', re: /Hematocrit|\bHct\b|血比容|血球容積/i },
  { g: '營養與貧血', k: 'fer', n: '鐵蛋白', e: 'Ferritin', u: 'ng/mL', re: /Ferritin|鐵蛋白/i },
  { g: '營養與貧血', k: 'tsat', n: '運鐵蛋白飽和度', e: 'TSAT', u: '%', re: /TSAT|Transferrin\s*sat\w*|飽和度/i },
  { g: '血糖與血脂', k: 'glu', n: '飯前血糖', e: 'Glu', u: 'mg/dL', re: /Glucose|\bGlu\b|血糖/i, ex: /A1c|糖化/i },
  { g: '血糖與血脂', k: 'hba1c', n: '糖化血色素', e: 'HbA1c', u: '%', re: /HbA1c|\bA1C\b|糖化血色素/i },
  { g: '血糖與血脂', k: 'chol', n: '總膽固醇', e: 'Chol', u: 'mg/dL', re: /Cholesterol|\bT-?CHOL?\b|\bCHOL\b|膽固醇/i, ex: /LDL|HDL/i },
  { g: '血糖與血脂', k: 'tg', n: '三酸甘油脂', e: 'TG', u: 'mg/dL', re: /Triglyceride\w*|\bTG\b|三酸甘油/i },
  { g: '其他', k: 'alt', n: '肝功能', e: 'GPT/ALT', u: 'U/L', re: /\bS?GPT\b|\bALT\b/i },
  { g: '其他', k: 'crp', n: 'C反應蛋白', e: 'CRP', u: 'mg/dL', re: /\bCRP\b|C反應蛋白/i }
];
const TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrWorker = null;

function normalizeOcr(t) {
  return String(t)
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[／]/g, '/').replace(/[（]/g, '(').replace(/[）]/g, ')')
    .replace(/(\d)\s*[．。·]\s*(\d)/g, '$1.$2')
    .replace(/([㐀-鿿])[ \t]+(?=[㐀-鿿])/g, '$1');
}
function parseLabText(text) {
  const values = {};
  const lines = normalizeOcr(text).split(/\r?\n/);
  for (const line of lines) {
    for (const it of LAB_ITEMS) {
      if (values[it.k] !== undefined) continue;
      if (it.ex && it.ex.test(line)) continue;
      const m = it.re.exec(line);
      if (!m) continue;
      const rest = line.slice(m.index + m[0].length);
      const nm = rest.match(/(?:^|[^\d.\-])(\d{1,3}(?:,\d{3})+(?!\d)|\d+(?:\.\d+)?)/);
      if (!nm) continue;
      const v = Number(nm[1].replace(/,/g, ''));
      if (Number.isFinite(v)) values[it.k] = v;
    }
  }
  // 報告日期（西元或民國）
  let date = null;
  const dm = normalizeOcr(text).match(/(20\d{2}|1[01]\d)\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/);
  if (dm) {
    let y = Number(dm[1]); if (y < 1911) y += 1911;
    const mo = Number(dm[2]), d = Number(dm[3]);
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) date = `${y}-${pad(mo)}-${pad(d)}`;
  }
  return { values, date };
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('load'));
    document.head.appendChild(s);
  });
}
async function ocrImage(blob, onProgress) {
  if (!window.Tesseract) await loadScript(TESSERACT_URL);
  if (!ocrWorker) {
    ocrWorker = await Tesseract.createWorker(['chi_tra', 'eng'], 1, {
      logger: m => {
        if (m.status === 'recognizing text') onProgress('辨識文字中', m.progress);
        else if (/load|initializ/i.test(m.status)) onProgress('第一次使用：下載辨識資料中', m.progress || 0);
      }
    });
  }
  const { data } = await ocrWorker.recognize(blob);
  return data.text || '';
}

const ym = s => s.slice(0, 7);
const ymLabel = s => `${Number(s.slice(0, 4))}年${Number(s.slice(5, 7))}月`;
const ymShort = s => `${Number(s.slice(2, 4))}/${Number(s.slice(5, 7))}月`;
let labEndMonth = null;

function labWindow() {
  const months = [...new Set(db.labs.map(l => ym(l.date)))].sort();
  if (!months.length) return { months: [], win: [] };
  const end = labEndMonth && months.includes(labEndMonth) ? labEndMonth : months[months.length - 1];
  const i = months.indexOf(end);
  return { months, end, win: months.slice(Math.max(0, i - 2), i + 1) };
}
const labOf = m => db.labs.find(l => ym(l.date) === m);
const lv = (l, k) => l && l.values && l.values[k] !== undefined && l.values[k] !== null ? l.values[k] : null;

  h += `<div class="month-label">每月報告</div>`;

  $('#labCsv3').addEventListener('click', () => exportLabCsv(win, `驗血近三個月-${end}`));
  $('#labCsvAll').addEventListener('click', () => exportLabCsv(months, `驗血全部-${today()}`));

function exportLabCsv(months, name) {
  const rows = [['項目', '英文', '單位', ...months.map(ymLabel)]];
  rows.push(['驗血日期', '', '', ...months.map(m => (labOf(m) || {}).date || '')]);
  for (const it of LAB_ITEMS) {
    const vals = months.map(m => lv(labOf(m), it.k));
    if (vals.every(v => v === null)) continue;
    rows.push([it.n, it.e, it.u, ...vals.map(v => v === null ? '' : v)]);
  }
  rows.push(['備註', '', '', ...months.map(m => (labOf(m) || {}).note || '')]);
  const csv = '﻿' + rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(',')).join('\r\n');
  shareFile(csv, `${name}.csv`, 'text/csv');
}

function openLab(lab) {

          ${isAndroid ? '安卓：在相簿開啟報告照片 →「Google 智慧鏡頭」→「文字」→ 全選 →「複製」' : 'iPhone：在「照片」開啟報告 → 按右下角「原況文字」圖示 → 長按文字「全選」→「拷貝」'}</div>

    const st = $('#lab-ocr-status'); if (!st) return;
    if (!log.length) { st.innerHTML = ''; return; }
    st.innerHTML = `<div class="info small" style="margin-top:10px">${log.map(x => `<div style="margin:4px 0">${x.html}</div>`).join('')}
      <div style="margin-top:6px">請對照報告逐項確認下方數值。</div></div>
      ${rawPages.length ? `<details class="raw"><summary>查看辨識出的文字</summary><pre>${rawPages.map(r => `【${r.label}】\n${esc(r.text) || '（沒有辨識到文字）'}`).join('\n\n')}</pre></details>` : ''}`;
    st.querySelectorAll('[data-fix]').forEach(b => b.addEventListener('click', () => {
      const inp = $(`#sheetBody .lab-item input[data-k="${b.dataset.fix}"]`);
      inp.value = b.dataset.v; markFilled(); b.replaceWith(document.createTextNode('（已改用）'));
    }));
  };
  // 解析一張報告的文字：只填空白欄；與已填數值不同時列出讓病友選
  const applyParsed = (text, label) => {
    const { values, date } = parseLabText(text);
    let n = 0; const conflicts = [];
    for (const [k, v] of Object.entries(values)) {
      const inp = $(`#sheetBody .lab-item input[data-k="${k}"]`);
      if (!inp) continue;
      const cur = num(inp.value);
      if (cur === null) { inp.value = fmt(v, 2); n++; }
      else if (Math.abs(cur - v) > 1e-9) conflicts.push({ k, v, cur });
    }
    if (date && !lab && date <= today() && !log.some(x => x.date)) $('#lab-date').value = date;
    rawPages.push({ label, text });
    let html = `${n ? '✅' : '⚪'} <b>${label}</b>：填入 ${n} 項${date ? `（報告日期 ${date}）` : ''}${!n && !conflicts.length ? '，沒有找到可對應的項目' : ''}`;
    for (const c of conflicts) {
      const it = LAB_ITEMS.find(x => x.k === c.k);
      html += `<br>⚠️ ${it.n}：這張是 <b>${fmt(c.v, 2)}</b>，已填 ${fmt(c.cur, 2)} <button class="btn sm" data-fix="${c.k}" data-v="${fmt(c.v, 2)}" style="min-height:30px;padding:2px 10px">改用 ${fmt(c.v, 2)}</button>`;
    }
    log.push({ html, date });
    markFilled(); drawLog();
    return n;
  };

  const refreshOcrBtn = () => {
    const btn = $('#lab-ocr'); if (!btn) return;
    const todo = photos.filter(p => !ocrDone.has(p.id)).length;
    btn.textContent = !photos.length ? '🔍 辨識照片中的數值' : todo ? `🔍 辨識 ${todo} 張新照片中的數值` : `🔁 重新辨識全部 ${photos.length} 張`;
  };
  const drawPhotos = () => {
    const box = $('#lab-photos'); if (!box) return;
    box.innerHTML = photos.map((p, i) => `<button type="button" class="ph" data-i="${i}" style="position:relative"><img src="${p.thumb}" alt="第 ${i + 1} 張">
        <span style="position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;padding:1px 6px;border-radius:6px">第${i + 1}張${ocrDone.has(p.id) ? ' ✓' : ''}</span></button>`).join('') +
      `<button type="button" class="add" id="lab-addPhoto"><span>＋</span>${photos.length ? `第 ${photos.length + 1} 張` : '拍報告'}</button>`;
    box.querySelectorAll('.ph').forEach(b => b.addEventListener('click', () => {
      const p = photos[Number(b.dataset.i)];
      viewPhoto(p, out => { if (out === 'delete') { photos.splice(photos.indexOf(p), 1); ocrDone.delete(p.id); drawPhotos(); } });
    }));
    $('#lab-addPhoto').addEventListener('click', () => {
      const inp = $('#photoInput');
      inp.onchange = async () => {
        const files = [...inp.files]; inp.value = '';
        if (!files.length) return;
        toast(files.length > 1 ? `處理 ${files.length} 張照片中…` : '照片處理中…');
        for (const f of files) {
          try {
            photos.push({ id: uid(), isNew: true, blob: await resizeImage(f, 2400, 0.9), thumb: await blobToDataURL(await resizeImage(f, 240, 0.7)) });
          } catch (e) { toast('有照片無法讀取'); }
        }
        drawPhotos();
      };
      inp.click();
    });
    refreshOcrBtn(); markFilled();
  };
  (async () => {
    for (const id of l.photos || []) {
      try { const p = await idb.get(id); if (p) photos.push({ id, isNew: false, thumb: p.thumb }); } catch (e) {}
    }
    drawPhotos();
  })();

  $('#lab-ocr').addEventListener('click', async () => {
    if (!photos.length) { toast('請先按「＋ 拍報告」加入照片'); return; }
    let targets = photos.filter(p => !ocrDone.has(p.id));
    if (!targets.length) {
      if (!confirm('全部照片都辨識過了，要重新辨識嗎？\n（只會填入目前空白的項目）')) return;
      targets = [...photos];
    }
    if (!window.Tesseract && !ocrWorker) {
      let first = true; try { first = !localStorage.getItem('ocr-ready'); } catch (e) {}
      if (first && !confirm('第一次辨識需要下載約 20 MB 的文字辨識資料（建議連上 Wi-Fi），下載後會保存在手機中。\n辨識在手機上進行，照片不會上傳。要繼續嗎？')) return;
    }
    const st = $('#lab-ocr-status');
    const btn = $('#lab-ocr'); btn.disabled = true;
    try {
      for (let t = 0; t < targets.length; t++) {
        const p = targets[t];
        const page = photos.indexOf(p) + 1;
        const blob = p.blob || (await idb.get(p.id))?.blob;
        if (!blob) continue;
        const text = await ocrImage(blob, (label, pr) => {
          const done = log.map(x => `<div style="margin:4px 0">${x.html}</div>`).join('');
          st.innerHTML = `<div class="info small" style="margin-top:10px">${done}<div style="margin:4px 0">${label}：第 ${page} 張（${t + 1}/${targets.length}）… ${Math.round(pr * 100)}%</div>
            <div class="ocr-bar"><div style="width:${Math.round(pr * 100)}%"></div></div></div>`;
        });
        ocrDone.add(p.id);
        applyParsed(text, `第 ${page} 張照片`);
        drawPhotos();
      }
      try { localStorage.setItem('ocr-ready', '1'); } catch (e) {}
    } catch (e) {
      log.push({ html: '⚠️ 照片辨識失敗（可能是網路不通或手機記憶體不足）。請改用「📋 改用貼上文字」，或直接手動輸入。' });
      drawLog();
    } finally { btn.disabled = false; refreshOcrBtn(); }
  });
  $('#lab-paste-btn').addEventListener('click', () => {
    const box = $('#lab-paste'); box.style.display = box.style.display === 'none' ? '' : 'none';
    if (box.style.display === '') $('#lab-paste-text').focus();
  });
  $('#lab-paste-go').addEventListener('click', () => {
    const ta = $('#lab-paste-text');
    if (!ta.value.trim()) { toast('請先貼上報告文字'); return; }
    pasteCount++;
    const n = applyParsed(ta.value, `貼上的第 ${pasteCount} 張`);
    ta.value = '';
    ta.placeholder = `在這裡長按「貼上」第 ${pasteCount + 1} 張報告的文字`;
    $('#lab-paste-go').textContent = `填入第 ${pasteCount + 1} 張的數值`;
    toast(`第 ${pasteCount} 張填入 ${n} 項，可以接著貼下一張`);
  });
  const del = $('#lab-del');
  if (del) del.addEventListener('click', () => {
    if (!confirm('確定刪除這份驗血報告？' + (l.photos && l.photos.length ? '\n照片也會一起刪除。' : ''))) return;
    (l.photos || []).forEach(id => idb.del(id).catch(() => {}));
    db.labs = db.labs.filter(x => x.id !== l.id);
    save(); closeSheet(); render(); toast('已刪除');
  });
  markFilled();
}

const DOCS = {
  front: { name: '身心障礙手冊', sub: '正面', title: '身心障礙手冊（正面）' },

let docTarget = null, dvKey = null, dvUrl = null;

function renderDocs() {
  const d = db.docs || {};
  $('#docs').innerHTML = `<div class="card"><h2>🪪 身心障礙證明 <span class="muted small" style="font-weight:500">（可不填）</span></h2>
    <div class="docs">${Object.entries(DOCS).map(([k, v]) => d[k] && d[k].thumb
      ? `<button class="doc-slot" data-doc="${k}"><div class="thumb" style="background-image:url('${d[k].thumb}')"></div><div class="cap">${v.name}<small>${v.sub}・點我全螢幕</small></div></button>`
      : `<button class="doc-slot empty" data-doc="${k}"><span class="plus">＋</span><span class="cap">${v.name}<small>${v.sub}・點我加入照片</small></span></button>`).join('')}
    </div>
    <p class="hint" style="margin:10px 2px 0">🔒 照片只存在您自己的手機裡，不會上傳到網路。可從相簿選擇或直接拍照；直接拍的照片不會進入手機相簿，請記得到「備份」頁按「<b>匯出備份檔</b>」存檔。</p>
    </div>`;
  $('#docs').querySelectorAll('[data-doc]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.doc;
    if (d[k] && d[k].thumb) openDoc(k); else pickDoc(k);
  }));
}

function pickDoc(k) {
  docTarget = k;
  $('#docInput').click();
}
$('#docInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  const k = docTarget; docTarget = null;
  if (!f || !k) return;
  try {
    toast('照片處理中…');
    const blob = await resizeImage(f, 2400, 0.9);        // 保留清晰度方便出示
    const thumb = await blobToDataURL(await resizeImage(f, 320, 0.7));
    await idb.put({ id: 'doc-' + k, blob, thumb, date: today() });
    db.docs = db.docs || {};
    db.docs[k] = { thumb, at: new Date().toISOString() };
    save(); renderDocs(); toast('已儲存，記得到「備份」頁匯出備份檔');
    if ($('#docview').classList.contains('open')) openDoc(k);
  } catch (err) { alert('照片儲存失敗，請換一張照片或確認手機空間。'); }
});

async function openDoc(k) {
  const p = await idb.get('doc-' + k).catch(() => null);
  if (!p) { toast('找不到照片，請重新選擇'); pickDoc(k); return; }
  dvKey = k;
  if (dvUrl) URL.revokeObjectURL(dvUrl);
  dvUrl = URL.createObjectURL(p.blob);
  $('#dvImg').src = dvUrl;
  $('#dvTitle').textContent = DOCS[k].title;
  $('#docview').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDoc() {
  $('#docview').classList.remove('open');
  document.body.style.overflow = '';
  if (dvUrl) { URL.revokeObjectURL(dvUrl); dvUrl = null; }
}
$('#dvHome').addEventListener('click', () => { closeDoc(); closeViewer(); closeSheet(); showTab('records'); });
$('#dvChange').addEventListener('click', () => pickDoc(dvKey));
$('#dvDel').addEventListener('click', async () => {
  if (!confirm(`確定刪除「${DOCS[dvKey].title}」的照片？`)) return;
  await idb.del('doc-' + dvKey).catch(() => {});
  if (db.docs) delete db.docs[dvKey];
  save(); closeDoc(); renderDocs(); toast('已刪除');
});

function buildPrompt(text, hasPhoto) {
  text = text.trim();
  if (hasPhoto) return AI_PREFIX + '請查詢照片中機台面板顯示的故障代碼或訊息的意思與改善方式。' + (text ? `補充說明：${text}` : '');
  return AI_PREFIX + `請查詢故障代碼與改善方式：${text}`;
}
const aiModeUrl = q => 'https://www.google.com/search?udm=50&q=' + encodeURIComponent(q);

function askAI() {
  const text = ($('#askText').value || '').trim();
  if (!text && !askPhoto) { toast('請輸入代碼或加入照片'); $('#askText').focus(); return; }
  const prompt = buildPrompt(text, !!askPhoto);
  if (!askPhoto) { openExternal(aiModeUrl(prompt)); return; }

  // 方式一：把照片＋查詢說明分享給 Google App（或 Gemini）
  const file = new File([askPhoto], `透析機異常代碼-${today()}.jpg`, { type: 'image/jpeg' });
  try { navigator.clipboard.writeText(prompt).catch(() => {}); } catch (e) {}
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], text: prompt }).catch(e => {
      if (e.name === 'AbortError') return;
      navigator.share({ files: [file] }).catch(() => {});
    });
  } else {
    alert('這個瀏覽器無法分享照片，將改用文字查詢。\n請在 Google 頁面按「＋」或相機圖示自行上傳照片。');
    openExternal(aiModeUrl(prompt));
  }
}

/* ============ 照片儲存（IndexedDB，存在手機本機） ============ */
const idb = (() => {
  let opening;
  const open = () => opening || (opening = new Promise((res, rej) => {
    const req = indexedDB.open('dialysis-photos', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('photos', { keyPath: 'id' });
    req.onsuccess = () => res(req.result);
    req.onerror = () => { opening = null; rej(req.error); };
  }));
  const tx = async (mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction('photos', mode);
      const req = fn(t.objectStore('photos'));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = t.onabort = () => rej(t.error);
    });
  };
  return {
    get: id => tx('readonly', s => s.get(id)),
    put: o => tx('readwrite', s => { s.put(o); }),
    del: id => tx('readwrite', s => { s.delete(id); }),
    all: () => tx('readonly', s => s.getAll()),
    clear: () => tx('readwrite', s => { s.clear(); })
  };
})();

async function resizeImage(file, maxSide, quality) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s);
    c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', quality));
  } finally { URL.revokeObjectURL(url); }
}
const blobToDataURL = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
const dataURLToBlob = async u => (await fetch(u)).blob();

let viewerUrl = null, viewerCb = null, viewerBlob = null, viewerName = '';
async function viewPhoto(p, cb) {
  viewerCb = cb;
  viewerBlob = p.blob || (await idb.get(p.id).catch(() => null))?.blob || null;
  if (!viewerBlob) { toast('找不到這張照片'); return; }
  const rec = db.records.find(r => (r.photos || []).includes(p.id));
  viewerName = `洗腎紀錄-${rec ? rec.date : today()}-${p.id.slice(-4)}.jpg`;
  $('#viewerInfo').textContent = rec ? fmtDay(rec.date) : '新照片（尚未儲存）';
  if (viewerUrl) URL.revokeObjectURL(viewerUrl);
  viewerUrl = URL.createObjectURL(viewerBlob);
  $('#viewerImg').src = viewerUrl;
  $('#viewerDel').style.display = cb ? '' : 'none';
  $('#viewer').classList.add('open');
}
function closeViewer() {
  $('#viewer').classList.remove('open');
  if (viewerUrl) { URL.revokeObjectURL(viewerUrl); viewerUrl = null; }
}
$('#viewerClose').addEventListener('click', closeViewer);
$('#viewerSave').addEventListener('click', async () => {
  if (!viewerBlob) return;
  const file = new File([viewerBlob], viewerName, { type: 'image/jpeg' });
  if (!isAndroid && navigator.canShare && navigator.canShare({ files: [file] })) {
    // iPhone：分享選單 →「儲存影像」
    try { await navigator.share({ files: [file] }); } catch (e) {}
  } else {
    // 安卓：直接下載，會出現在相簿／Google 相簿的「Download」資料夾
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = viewerName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast('已下載到手機');
  }
});
$('#viewerSave').textContent = isAndroid ? '下載到手機' : '存到手機相簿';
$('#viewerDel').addEventListener('click', () => {
  if (!confirm('要移除這張照片嗎？（按「儲存」後才會真正刪除）')) return;
  const cb = viewerCb; closeViewer(); if (cb) cb('delete');
});

/* ============ 備份頁 ============ */
async function shareFile(text, filename, type) {
  const file = new File([text], filename, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return true;
}
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function renderBackup() {
  $('#installTip').innerHTML = isStandalone() ? '' : `<div class="card"><h2>📲 加入主畫面</h2><div class="info">${isAndroid ?
    `請用 <b>Chrome</b> 把這個 App 加入主畫面，之後都從桌面圖示打開，資料才會長期保存。
    <ol><li>點 Chrome 右上角「⋮」</li><li>選「加到主畫面」或「安裝應用程式」</li><li>按「安裝」或「新增」</li></ol>` :
    `請用 <b>Safari</b> 把這個 App 加入主畫面，之後都從主畫面圖示打開，資料才會長期保存。
    <ol><li>點 Safari 下方的「分享」按鈕</li><li>選「加入主畫面」</li><li>按右上角「加入」</li></ol>`}</div></div>`;
  const lb = db.lastBackup ? new Date(db.lastBackup) : null;
  const nPhotos = db.records.reduce((n, r) => n + (r.photos ? r.photos.length : 0), 0);
  $('#backupStatus').innerHTML = `目前有 <b>${db.records.length}</b> 筆紀錄、<b>${nPhotos}</b> 張照片、<b>${db.reminders.length}</b> 個提醒。<br>上次備份：${lb ? `${lb.getFullYear()}/${lb.getMonth() + 1}/${lb.getDate()}` : '尚未備份'}${nPhotos ? '<br>備份檔會包含照片，檔案會比較大。' : ''}`;
  const info = $('#storageInfo');
  if (navigator.storage && navigator.storage.persisted) {
    navigator.storage.persisted().then(p => {
      info.textContent = p ? '已開啟長期儲存保護。' : '提醒：請從主畫面圖示開啟 App，並定期備份。';
    });
  }
}
$('#exportJson').addEventListener('click', async () => {
  toast('準備備份檔…');
  const used = new Set(db.records.flatMap(r => r.photos || []));
  Object.keys(db.docs || {}).forEach(k => used.add('doc-' + k));
  (db.labs || []).forEach(l => (l.photos || []).forEach(id => used.add(id)));
  const photos = [];
  try {
    for (const p of await idb.all()) {
      if (used.has(p.id)) photos.push({ id: p.id, date: p.date, thumb: p.thumb, data: await blobToDataURL(p.blob) });
    }
  } catch (e) {}
  const data = JSON.stringify({ app: 'dialysis-tracker', version: 2, exportedAt: new Date().toISOString(), records: db.records, reminders: db.reminders, profile: db.profile || null, docs: db.docs || null, labs: db.labs || [], photos });
  const ok = await shareFile(data, `洗腎紀錄備份-${today()}.json`, 'application/json');
  if (ok) { db.lastBackup = new Date().toISOString(); save(); renderBackup(); toast('備份檔已匯出'); }
});
$('#importJson').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.records) || !Array.isArray(d.reminders)) throw new Error('format');
    const ph = Array.isArray(d.photos) ? d.photos : [];
    if (!confirm(`備份檔內有 ${d.records.length} 筆紀錄、${ph.length} 張照片、${d.reminders.length} 個提醒。\n還原後會取代目前手機上的資料，確定嗎？`)) return;
    toast('還原中…');
    await idb.clear();
    for (const p of ph) {
      await idb.put({ id: p.id, date: p.date, thumb: p.thumb, blob: await dataURLToBlob(p.data) });
    }
    db.records = d.records; db.reminders = d.reminders;
    if (d.profile) db.profile = d.profile;
    db.docs = d.docs || null;
    db.labs = Array.isArray(d.labs) ? d.labs : [];
    save(); renderBackup(); toast('已還原');
  } catch (err) { alert('無法讀取這個檔案，請確認是本 App 匯出的備份檔。'); }
});
$('#exportCsv').addEventListener('click', () => {
  const rows = [['日期', '收縮壓', '舒張壓', '體重(kg)', '第一包(mL)', '第二包(mL)', '第三包(mL)', '第四包(mL)', '全天脫水量(mL)', '水腫', '備註']];
  for (const r of [...db.records].sort((a, b) => a.date.localeCompare(b.date))) {
    rows.push([r.date, r.sys, r.dia, r.weight, ...r.bags, totalUF(r), r.edema === true ? '有' : r.edema === false ? '無' : '', r.note].map(x => x === null || x === undefined ? '' : x));
  }
  const csv = '\uFEFF' + rows.map(row => row.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(',')).join('\r\n');
  shareFile(csv, `洗腎紀錄-${today()}.csv`, 'text/csv');
});
$('#shareApp').addEventListener('click', async () => {
  const url = location.origin + location.pathname;
  const text = '洗腎紀錄 App：記錄血壓、體重、脫水量，還有回診與領藥提醒。iPhone 請用 Safari、安卓請用 Chrome 打開，再「加入主畫面」。';
  if (navigator.share) {
    try { await navigator.share({ title: '洗腎紀錄', text, url }); } catch (e) {}
  } else {
    try { await navigator.clipboard.writeText(text + '\n' + url); toast('網址已複製'); }
    catch (e) { prompt('請複製這個網址', url); }
  }
});
$('#clearAll').addEventListener('click', () => {
  if (!confirm('確定要清除所有紀錄與提醒嗎？此動作無法復原。')) return;
  if (!confirm('再確認一次：清除前建議先匯出備份。真的要清除嗎？')) return;
  idb.clear().catch(() => {});
  db = { records: [], reminders: [], profile: null, docs: null, labs: [], lastBackup: null }; save(); renderBackup(); toast('已清除');
});

/* ============ 啟動 ============ */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
showTab('records');
</script>
